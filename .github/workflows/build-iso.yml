name: Build DelgadoOS ISO 

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on:
      - self-hosted
      - linux
      - x64
      - lfs-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar scripts
        run: |
          bash -n scripts/check-rootfs.sh
          bash -n scripts/build-iso.sh

      - name: Verificar rootfs
        env:
          ROOTFS_DIR: ${{ vars.DELGADOOS_ROOTFS_DIR }}
        run: |
          test -n "$ROOTFS_DIR" || {
            echo "Configure DELGADOOS_ROOTFS_DIR nas variáveis do repositório."
            exit 1
          }
          chmod +x scripts/*.sh
          scripts/check-rootfs.sh

      - name: Criar ISO
        env:
          ROOTFS_DIR: ${{ vars.DELGADOOS_ROOTFS_DIR }}
        run: scripts/build-iso.sh

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: delgadoos-iso
          path: dist/delgadoos.iso
          if-no-files-found: error
