name: Build DelgadoOS ISO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-iso:
    name: Compile and Generate ISO
    runs-on: ubuntu-24.04 

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Cache do Compilador (ccache)
        uses: actions/cache@v4
        with:
          path: /mnt/delgadoos/tools
          key: ${{ runner.os }}-lfs-toolchain-${{ hashFiles('scripts/01-lfs-base.sh') }}
          restore-keys: |
            ${{ runner.os }}-lfs-toolchain-

      - name: Instalar Dependências do Host (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison gawk texinfo squashfs-tools \
                                  xorriso grub-pc-bin grub-efi mtools libelf-dev libssl-dev ccache

      - name: Executar Build Orchestrator
        run: |
          chmod +x build.sh scripts/*.sh
          sudo -E ./build.sh

      - name: Upload do Artefato (delgadoos.iso)
        uses: actions/upload-artifact@v4
        with:
          name: delgadoos-1.0-iso
          path: out/delgadoos.iso
          retention-days: 5 
          if-no-files-found: error
